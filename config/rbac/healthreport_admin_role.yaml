# This rule is not used by the project kubemedic itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over observability.kubemedic.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubemedic
    app.kubernetes.io/managed-by: kustomize
  name: healthreport-admin-role
rules:
- apiGroups:
  - observability.kubemedic.io
  resources:
  - healthreports
  verbs:
  - '*'
- apiGroups:
  - observability.kubemedic.io
  resources:
  - healthreports/status
  verbs:
  - get
