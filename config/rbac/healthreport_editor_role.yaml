# This rule is not used by the project kubemedic itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the observability.kubemedic.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubemedic
    app.kubernetes.io/managed-by: kustomize
  name: healthreport-editor-role
rules:
- apiGroups:
  - observability.kubemedic.io
  resources:
  - healthreports
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - observability.kubemedic.io
  resources:
  - healthreports/status
  verbs:
  - get
